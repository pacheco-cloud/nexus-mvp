version: '3.8'

services:
  nexus-editor-dev:
    build:
      context: ./editor-frontend
      dockerfile: Dockerfile.dev
    ports:
      - "8080:5173"
    volumes:
      - ./editor-frontend/src:/app/src
    environment:
      - NODE_ENV=development

  nexus-api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    ports:
      - "3002:3000"
    volumes:
      - ./backend/api-gateway:/app # Volume para hot-reload
      - /app/node_modules # Preserva node_modules do container
    environment:
      - NODE_ENV=development
      # --- ADIÇÕES PARA BANCO DE DADOS ---
      - POSTGRES_USER=nexus
      - POSTGRES_PASSWORD=nexus
      - POSTGRES_DB=nexus_mvp
      - POSTGRES_HOST=nexus-database # Aponta para o serviço de banco de dados
    depends_on: # Garante que o banco de dados inicie antes da API
      - nexus-database

  # --- NOVO SERVIÇO: BANCO DE DADOS POSTGRESQL ---
  nexus-database:
    image: postgres:14-alpine
    container_name: nexus-database
    environment:
      - POSTGRES_USER=nexus
      - POSTGRES_PASSWORD=nexus
      - POSTGRES_DB=nexus_mvp
    ports:
      - "5433:5432" # Mudando para porta 5433 para evitar conflito
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
